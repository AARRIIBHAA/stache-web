<!--
  Supabase auth email redirect target.

  After a user taps the "Confirm your signup" link in their verification
  email, Supabase verifies the token server-side and then redirects their
  browser here. This page is purely informational and does not talk to
  Supabase or the app itself.

  This file must be hosted somewhere (e.g. static hosting) and that URL
  set manually in the Supabase dashboard under
  Authentication > URL Configuration as the confirmation redirect URL.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email verified, Stache</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d16" media="(prefers-color-scheme: dark)" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --field: #F2F2F7;
    --text: #0D0D0D;
    --text-2: #4a4a52;
    --accent: #FF6B35;
    --accent-text: #ce3700;
    --on-accent: #14140f;
    --over: #dd0c00;
    --hair: rgba(13, 13, 13, .10);
    --soft: rgba(255, 107, 53, .14);
    --shadow: 0 8px 24px -10px rgba(13, 13, 13, .16);
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d16;
      --card: #17171f;
      --field: #1e1e28;
      --text: #F5F3EC;
      --text-2: #b9b9c6;
      --accent-text: #FF6B35;
      --over: #ef4444;
      --hair: rgba(245, 243, 236, .08);
      --soft: rgba(255, 107, 53, .16);
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    max-width: 400px;
    width: 100%;
    border-radius: 18px;
    box-shadow: var(--shadow), 0 0 0 1px var(--hair);
    padding: 48px 40px;
    text-align: center;
    animation: rise 400ms var(--ease) both;
  }
  .card > img, .card > picture img { display: block; margin: 0 auto 8px; }
  .tagline {
    font-size: 15px;
    line-height: 20px;
    color: var(--text-2);
    margin: 8px 0 32px;
  }
  .check-circle {
    width: 80px;
    height: 80px;
    border-radius: 999px;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .check-circle svg { width: 36px; height: 36px; }
  .check-circle path { stroke: var(--accent-text); }
  h1 {
    color: var(--text);
    font-size: 28px;
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .subtitle {
    color: var(--text-2);
    font-size: 15px;
    line-height: 22px;
    max-width: 300px;
    margin: 0 auto 24px;
  }
  #successState, #invalidState { animation: rise 300ms var(--ease) both; }
  form { text-align: left; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin: 16px 0 8px;
  }
  input[type="password"] {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--hair);
    background: var(--field);
    font: inherit;
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
  }
  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--soft);
  }
  input[type="password"]:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
  button {
    width: 100%;
    height: 48px;
    margin-top: 24px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 120ms var(--ease), opacity 150ms var(--ease);
  }
  button:hover { opacity: .92; }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    color: var(--over);
    font-size: 14px;
    line-height: 20px;
    margin-top: 12px;
    display: none;
  }
  .hidden { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @media (max-width: 480px) {
    body { padding: 16px; }
    .card { padding: 40px 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, #successState, #invalidState { animation: fade 200ms ease both; }
    button:active { transform: none; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
  <div class="card">
    <picture>
      <source srcset="./logo-full-dark.png" media="(prefers-color-scheme: dark)">
      <img src="./logo-full.png" alt="Stache" style="width: 200px; height: auto; margin-bottom: 8px;">
    </picture>
    <p class="tagline">No receipts. No stress.</p>

    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12.5L9.5 18L20 6" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>You're verified!</h1>
    <p class="subtitle">Your Stache account is ready. Head back to the app to continue setting up.</p>
  </div>
</body>
</html>
